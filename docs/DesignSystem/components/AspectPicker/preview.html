<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AspectPicker — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;height:100%;} body{background:var(--passthrough-dim);}</style>
</head>
<body class="sp">
<div class="sp-stage"><div class="sp-panel"><h3 class="sp-title">+ Monitor virtual</h3>
<div class="sp-btn "><span class="sp-btn__text">← Voltar</span></div>
<div class="sp-grid"><div class="sp-btn is-pressed"><span class="sp-btn__text">Paisagem</span><span class="sp-btn__end">↔</span></div><div class="sp-btn "><span class="sp-btn__text">Retrato</span><span class="sp-btn__end">↕</span></div></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="sp-btn is-selected" style="flex-direction:column;justify-content:center;gap:8px;padding:12px;min-height:120px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="4.0" y="16.2" width="56.0" height="31.5" rx="3" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>16:9</span></div><div class="sp-btn " style="flex-direction:column;justify-content:center;gap:8px;padding:12px;min-height:120px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="4.0" y="14.5" width="56.0" height="35.0" rx="3" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>16:10</span></div><div class="sp-btn is-hover" style="flex-direction:column;justify-content:center;gap:8px;padding:12px;min-height:120px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="4.0" y="20.0" width="56.0" height="24.0" rx="3" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>21:9</span></div><div class="sp-btn " style="flex-direction:column;justify-content:center;gap:8px;padding:12px;min-height:120px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="4.0" y="24.1" width="56.0" height="15.8" rx="3" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>32:9</span></div><div class="sp-btn " style="flex-direction:column;justify-content:center;gap:8px;padding:12px;min-height:120px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="4.0" y="4.0" width="56.0" height="56.0" rx="3" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>1:1</span></div><div class="sp-btn " style="flex-direction:column;justify-content:center;gap:8px;padding:12px;min-height:120px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="4.0" y="11.0" width="56.0" height="42.0" rx="3" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>4:3</span></div></div></div><div class="sp-panel"><h3 class="sp-title">Recriar: DISPLAY3</h3>
<div class="sp-btn "><span class="sp-btn__text">← Voltar</span></div>
<p class="sp-caption">16:9 · paisagem</p>
<div class="sp-section"><div class="sp-btn "><span class="sp-btn__text">1920×1080<span class="sp-btn__sub">Full HD</span></span></div><div class="sp-btn is-disabled"><span class="sp-btn__text">2560×1440<span class="sp-btn__sub">QHD</span></span><span class="sp-btn__end">atual</span></div><div class="sp-btn is-hover"><span class="sp-btn__text">3840×2160<span class="sp-btn__sub">4K · mais pesado</span></span></div></div></div></div>
</body>
</html>
