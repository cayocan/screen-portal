<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MenuButton — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;height:100%;} body{background:var(--passthrough-dim);}</style>
</head>
<body class="sp">
<div class="sp-stage"><div style="display:flex;flex-direction:column;gap:8px;width:300px"><span class="sp-label" style="color:var(--ink);text-shadow:0 0 4px var(--halo)">Normal</span><div class="sp-btn "><span class="sp-btn__text">Recentrar</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:300px"><span class="sp-label" style="color:var(--ink);text-shadow:0 0 4px var(--halo)">Hover</span><div class="sp-btn is-hover"><span class="sp-btn__text">Recentrar</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:300px"><span class="sp-label" style="color:var(--ink);text-shadow:0 0 4px var(--halo)">Pressionado</span><div class="sp-btn is-pressed"><span class="sp-btn__text">Recentrar</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:300px"><span class="sp-label" style="color:var(--ink);text-shadow:0 0 4px var(--halo)">Selecionado</span><div class="sp-btn is-selected"><span class="sp-btn__icon">✓</span><span class="sp-btn__text">Média</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:300px"><span class="sp-label" style="color:var(--ink);text-shadow:0 0 4px var(--halo)">Desabilitado</span><div class="sp-btn is-disabled"><span class="sp-btn__text">Desfazer</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:300px"><span class="sp-label" style="color:var(--ink);text-shadow:0 0 4px var(--halo)">Aviso</span><div class="sp-btn is-warn"><span class="sp-btn__icon">!</span><span class="sp-btn__text">Fixo 15</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:400px"><span class="sp-label" style="text-shadow:0 0 4px var(--halo)">Com submenu</span><div class="sp-btn "><span class="sp-btn__text">Curvatura</span><span class="sp-btn__end">Média ▸</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;width:400px"><span class="sp-label" style="text-shadow:0 0 4px var(--halo)">Com toggle</span><div class="sp-btn "><span class="sp-btn__text">Grade</span><span class="sp-toggle is-on"></span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;width:400px"><span class="sp-label" style="text-shadow:0 0 4px var(--halo)">Destrutivo</span><div class="sp-btn is-danger"><span class="sp-btn__icon">×</span><span class="sp-btn__text">Remover tela</span></div></div></div>
</body>
</html>
