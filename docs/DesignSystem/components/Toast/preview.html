<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Toast — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;height:100%;} body{background:var(--passthrough-dim);}</style>
</head>
<body class="sp">
<div class="sp-stage sp-stage--split" style="height:100%"><div style="flex-direction:column">
<div class="sp-toast"><span class="sp-toast__icon">↶</span><span>Desfeito: mover DISPLAY3</span><span class="sp-toast__action">Refazer</span></div>
<div class="sp-toast"><span>Mãos desligadas · acene para ligar</span></div>
<div class="sp-toast is-ok"><span class="sp-toast__icon">✓</span><span>Monitor criado · 2560×1440</span></div></div>
<div style="flex-direction:column">
<div class="sp-toast is-warn"><span class="sp-toast__icon">!</span><span>Taxa alta: pode travar</span></div>
<div class="sp-toast is-danger"><span class="sp-toast__icon">×</span><span>Tela removida</span><span class="sp-toast__action">Desfazer</span></div>
<div class="sp-toast"><span>Recentrar</span><span class="sp-keys"><span class="sp-kbd">Ctrl+Alt+R</span></span></div></div></div>
</body>
</html>
