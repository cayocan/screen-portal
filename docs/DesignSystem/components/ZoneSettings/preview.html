<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ZoneSettings — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;height:100%;} body{background:var(--passthrough-dim);}</style>
</head>
<body class="sp">
<div class="sp-stage">
<div class="sp-panel"><h3 class="sp-title">Zona da mesa</h3><div class="sp-btn "><span class="sp-btn__text">← Voltar</span></div>
<div class="sp-seg"><span class="is-active">Retângulo</span><span>Arredond.</span><span>Elipse</span></div>
<div class="sp-slider is-hover"><div class="sp-slider__head"><b>Borda suave</b><span>4 cm</span></div><div class="sp-slider__track"><div class="sp-slider__fill" style="width:40%"></div><div class="sp-slider__thumb" style="left:40%"></div></div></div>
<div class="sp-slider"><div class="sp-slider__head"><b>Escurecer o mundo</b><span>80 %</span></div><div class="sp-slider__track"><div class="sp-slider__fill" style="width:80%"></div><div class="sp-slider__thumb" style="left:80%"></div></div></div>
<div class="sp-btn "><span class="sp-btn__text">Revelar ao olhar para baixo</span><span class="sp-toggle is-on"></span></div>
<div class="sp-grid"><div class="sp-btn "><span class="sp-btn__text">Altura</span><span class="sp-btn__end">72 cm ▸</span></div><div class="sp-btn is-danger"><span class="sp-btn__icon">×</span><span class="sp-btn__text">Remover zona</span></div></div>
</div>
<div style="display:flex;flex-direction:column;gap:32px">
<div class="sp-panel sp-conn is-warn"><div class="sp-conn__row"><div class="sp-conn__icon">!</div><h3 class="sp-title">Perdemos a posição da mesa</h3></div><p class="sp-body">A zona fica escondida até você confirmar onde a mesa está.</p><div class="sp-grid" style="width:100%"><div class="sp-btn "><span class="sp-btn__text">Reposicionar</span><span class="sp-btn__end">▸</span></div><div class="sp-btn "><span class="sp-btn__text">Mundo claro</span></div></div></div>
<div class="sp-toast"><span>Zona da mesa ligada</span><span class="sp-keys"><span class="sp-kbd">Ctrl+Alt+P</span></span></div>
</div></div>
</body>
</html>
