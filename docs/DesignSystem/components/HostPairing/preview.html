<!doctype html>

<title>HostPairing — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">

<body class="sp">
<div class="hd" style="background:var(--void);padding:24px;display:flex;gap:24px;align-items:flex-start;min-height:100%;box-sizing:border-box"><div class="hd-win" style="width:420px"><div class="hd-titlebar"><span>Screen Portal · Parear</span><div class="hd-titlebar__ctl"><span>×</span></div></div>

<div class="hd-win" style="width:420px"><div class="hd-titlebar"><span>Screen Portal</span><div class="hd-titlebar__ctl"><span>×</span></div></div>
<div class="hd-body"><div class="hd-row"><span class="hd-dot"></span><h2 class="hd-title">Pareado</h2></div><span>Coloque o óculos: seu monitor principal já está lá.</span><div class="hd-row" style="justify-content:flex-end"><button class="hd-btn is-primary">Fechar</button></div></div></div></div>
