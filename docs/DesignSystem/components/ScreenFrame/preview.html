<!-- @dsCard group="Tela" height=640 width=1200 subtitle="Moldura, alças, curvatura, rótulo e guia de encaixe" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ScreenFrame — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0;height:100%;} body{background:var(--passthrough-dim);}
.w-halo{fill:none;stroke:var(--halo);stroke-width:9px;stroke-linecap:round}
.w-frame{fill:none;stroke:var(--portal);stroke-width:var(--stroke-focus)}
.w-guide{fill:none;stroke:var(--edit);stroke-width:var(--stroke-world);stroke-dasharray:14 10;stroke-linecap:round}
.w-hdl{fill:var(--panel);stroke:var(--portal);stroke-width:var(--stroke-focus)}
.w-hdl.on{fill:var(--edit);stroke:var(--edit)}
.w-curve{fill:var(--panel);stroke:var(--portal);stroke-width:var(--stroke-focus)}
.w-scr{fill:var(--panel-raised)}
.w-scr2{fill:var(--panel-raised);opacity:1}
.w-win{fill:var(--panel-hover)}
.w-ink{fill:var(--ink-muted)}
</style>
</head>
<body class="sp">
<div class="sp-stage" style="padding:0;display:block;position:relative;height:100%">
<svg viewBox="0 0 1200 640" width="1200" height="640" style="display:block">
<!-- tela vizinha à esquerda (sem seleção) -->
<rect class="w-scr2" x="40" y="170" width="300" height="300" rx="4"/>
<!-- guia de encaixe: topo alinhado -->
<line class="w-halo" x1="20" y1="170" x2="1180" y2="170"/>
<line class="w-guide" x1="20" y1="170" x2="1180" y2="170"/>
<!-- tela selecionada -->
<rect class="w-scr" x="380" y="170" width="640" height="360" rx="4"/>
<rect class="w-win" x="420" y="210" width="300" height="190" rx="4"/>
<rect class="w-ink" x="440" y="230" width="160" height="12" rx="6"/>
<rect class="w-ink" x="440" y="256" width="220" height="12" rx="6"/>
<rect class="w-halo" x="372" y="162" width="656" height="376" rx="8"/>
<rect class="w-frame" x="372" y="162" width="656" height="376" rx="8"/>
<!-- alças de canto 2,5° -->
<rect class="w-hdl" x="352" y="142" width="40" height="40" rx="8"/>
<rect class="w-hdl" x="1008" y="142" width="40" height="40" rx="8"/>
<rect class="w-hdl" x="352" y="518" width="40" height="40" rx="8"/>
<rect class="w-hdl on" x="1008" y="518" width="40" height="40" rx="8"/>
<!-- alça de curvatura -->
<rect class="w-curve" x="640" y="146" width="120" height="32" rx="16"/>
<path d="M664 166 Q700 154 736 166" fill="none" stroke="var(--portal)" stroke-width="4" stroke-linecap="round"/>
</svg>
<div class="sp-screen__name" style="position:absolute;left:380px;top:88px"><span>DISPLAY3</span><span class="sp-caption">2560×1440</span></div>
<div class="sp-toast" style="position:absolute;left:600px;top:40px;min-height:0;padding:6px 16px"><span>Média · 60 % · ≈ 1300R</span></div>
<div class="sp-toast" style="position:absolute;left:40px;top:560px;min-height:0;padding:6px 16px;border-color:var(--edit)"><span class="sp-toast__icon" style="color:var(--edit)">⇥</span><span>Encaixado · <span class="sp-kbd">Shift</span> solta</span></div>
</div>
</body>
</html>
